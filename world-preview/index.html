const stops=[{name:'江苏 · 盐城',en:'YANCHENG',coord:[120.16,33.35],note:'这是我出生的地方。',country:'CHN'},{name:'海南 · 海口',en:'HAIKOU',coord:[110.33,20.04],note:'从盐城出发，来到海口。',country:'CHN'},{name:'爱尔兰 · 都柏林',en:'DUBLIN',coord:[-6.26,53.35],note:'下一站，都柏林。',country:'IRL'},{name:'英国 · 伦敦',en:'LONDON',coord:[-.12,51.51],note:'从都柏林，飞往伦敦。',country:'GBR'},{name:'泰国 · 普吉岛',en:'PHUKET',coord:[98.39,7.88],note:'从伦敦出发，去普吉岛。',country:'THA'},{name:'中国 · 上海',en:'SHANGHAI',coord:[121.47,31.23],note:'旅程的这一站，是上海。',country:'CHN'}];
const visited=new Set(['USA','IRL','GBR','KEN','QAT','FIN','NLD','MDV','MYS','IDN','PHL','HKG','THA','KHM','JPN','KOR','SGP']);
const planned=new Set(['ITA','FRA','ESP','DEU','OMN','VNM','IND','NAM','ZAF','BRA']);
const places=[{id:'HKG',name:'香港',coord:[114.17,22.32]},{id:'SGP',name:'新加坡',coord:[103.82,1.35]},{id:'MDV',name:'马尔代夫',coord:[73.22,3.2]}];
const countries=WORLD.filter(c=>c.id!=='TWN').map(c=>c.id==='QAT'?{...c,name:'多哈（卡塔尔）'}:c);
for(const c of places)if(!countries.some(x=>x.id===c.id))countries.push(c);
const project=([x,y])=>[(x+180)*3,(85-y)*3];let step=-1,anim=0,selected=null;
function node(tag,attrs,parent){const el=document.createElementNS(NS,tag);for(const[k,v]of Object.entries(attrs))el.setAttribute(k,v);parent.append(el);return el;}
function openCountry(c){selected=c.id;document.querySelectorAll('[data-id]').forEach(p=>p.classList.toggle('chosen',p.dataset.id===c.id));$('detail-title').textContent=c.name;$('badge').textContent=visited.has(c.id)?'已点亮 / VISITED':planned.has(c.id)?'待点亮 / ON MY LIST':'尚待认识 / STILL CURIOUS';$('impression').textContent=visited.has(c.id)?'这里留下了我的足迹。':planned.has(c.id)?'下一次出发的方向。':'把好奇心留给下一次相遇。';$('photos').hidden=true;$('detail').showModal();}
function bindPlace(p,c){p.addEventListener('click',()=>openCountry(c));p.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openCountry(c)}});p.addEventListener('pointerenter',()=>{$('tooltip').hidden=false;$('tooltip').textContent=c.name});p.addEventListener('pointerleave',()=>{$('tooltip').hidden=true});}
for(const c of countries.filter(c=>c.d)){const p=node('path',{d:c.d,class:'country '+(visited.has(c.id)?'visited':planned.has(c.id)?'planned':''),'data-id':c.id,tabindex:'0',role:'button','aria-label':c.name+'，'+(visited.has(c.id)?'已点亮':planned.has(c.id)?'待点亮':'尚待认识')},$('countries'));node('title',{},p).textContent=c.name;bindPlace(p,c);}
// Small destinations get a visible marker and a larger transparent pointer target.
for(const c of places){const [x,y]=project(c.coord),g=node('g',{'data-id':c.id,class:'place-marker',tabindex:'0',role:'button','aria-label':c.name+'，已点亮'},$('places'));node('circle',{cx:x,cy:y,r:10,fill:'transparent'},g);node('circle',{cx:x,cy:y,r:3.8,fill:'#16865b',stroke:'#fff7df','stroke-width':1},g);node('title',{},g).textContent=c.name;bindPlace(g,c);}
for(const [label,ids] of [['已点亮',visited],['待点亮',planned],['探索更多',null]]){const group=document.createElement('optgroup');group.label=label;countries.filter(c=>ids?ids.has(c.id):!visited.has(c.id)&&!planned.has(c.id)).sort((a,b)=>a.name.localeCompare(b.name,'zh')).forEach(c=>{const o=document.createElement('option');o.value=c.id;o.textContent=c.name;group.append(o)});$('search').append(group);}
$('search').onchange=()=>{const c=countries.find(c=>c.id===$('search').value);if(c)openCountry(c)};
function markers(){ $('pins').replaceChildren();stops.forEach((s,i)=>{if(i>step)return;const[x,y]=project(s.coord);node('circle',{cx:x,cy:y,r:i===step?5:3.3,class:'city '+(i===step?'active':'')},$('pins'));if(i===step){node('text',{x:x+10,y:y-10,class:'city-label'},$('pins')).textContent=s.name;}});}
function update(){$('fly').setAttribute('aria-label',step===5?'查看关于我':'纸飞机：前往'+stops[step+1].name);markers();}
function rebuild(){ $('routes').replaceChildren();for(let i=1;i<=step;i++)addRoute(i);}
function curve(i){const a=project(stops[i-1].coord),b=project(stops[i].coord),m=[(a[0]+b[0])/2,Math.min(a[1],b[1])-Math.max(20,Math.abs(a[0]-b[0])*.16)];return{a,b,m,d:`M${a} Q${m} ${b}`}}
function addRoute(i){return node('path',{d:curve(i).d,class:'route'},$('routes'))}
function go(n){cancelAnimationFrame(anim);$('fly').disabled=false;$('flight-marker').setAttribute('visibility','hidden');if(n>5){$('profile').showModal();return;}const old=step;step=n;update();rebuild();if(step>=0){const b=project(stops[step].coord);$('flight-marker').setAttribute('visibility','visible');$('flight-marker').setAttribute('transform',`translate(${b})`);}if(step>0&&step===old+1&&!matchMedia('(prefers-reduced-motion: reduce)').matches){const {a,b,m}=curve(step);const start=performance.now();$('fly').disabled=true;function frame(now){const t=Math.min(1,(now-start)/1300),u=1-t;const x=u*u*a[0]+2*u*t*m[0]+t*t*b[0],y=u*u*a[1]+2*u*t*m[1]+t*t*b[1];$('flight-marker').setAttribute('transform',`translate(${x},${y})`);if(t<1)anim=requestAnimationFrame(frame);else $('fly').disabled=false;}anim=requestAnimationFrame(frame);}}
$('fly').onclick=()=>go(step+1);$('about').onclick=()=>$('profile').showModal();for(const d of document.querySelectorAll('dialog'))d.addEventListener('click',e=>{if(e.target===d){const r=d.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)d.close()}});$('wechat').onclick=async()=>{try{await navigator.clipboard.writeText('Yzj737724234');$('copy-status').textContent='微信号已复制';}catch{$('copy-status').textContent='微信号：Yzj737724234';}};
update();
</script></body></html>
